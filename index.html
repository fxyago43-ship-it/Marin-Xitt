<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0e121c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MARIN XITER</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #0b0f17, #030507);
            padding: 1.5rem;
        }

        .panel {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 90vh;
            background: #0e121c;
            border-radius: 2rem;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(0, 255, 255, 0.1),
                inset 0 1px 2px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 1.8rem 2rem 1.2rem 2rem;
            border: 1px solid #2a3346;
            transition: all 0.2s;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 2rem;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .panel > * { position: relative; z-index: 2; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #273145;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #d0e2ff, #b0c8ff, #7fa8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(0, 180, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .header h1 span {
            font-size: 1.2rem;
            color: #3f5f9e;
            font-weight: 400;
            letter-spacing: 0;
            text-shadow: none;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
        }

        .row-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn-main {
            flex: 1;
            min-width: 140px;
            padding: 0.9rem 0.5rem;
            border: none;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            color: white;
            background: linear-gradient(145deg, #1b2537, #131b28);
            box-shadow: 0 8px 0 #070b10, 0 6px 16px rgba(0,0,0,0.6);
            border: 1px solid #3b4d6b;
            cursor: pointer;
            transition: all 0.08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-shadow: 0 1px 2px black;
            user-select: none;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #070b10, 0 6px 16px rgba(0,0,0,0.6);
        }

        .btn-main.primary {
            background: linear-gradient(145deg, #1d4e6b, #0f3045);
            border-color: #3f8bb0;
            box-shadow: 0 8px 0 #06121f, 0 6px 16px #00000090;
        }

        .btn-main.inject {
            background: linear-gradient(145deg, #2b4b3c, #123128);
            border-color: #3e8a6b;
        }

        .btn-main:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #070b10;
            cursor: not-allowed;
        }

        .status-inject {
            font-size: 0.9rem;
            background: #0b101a;
            padding: 0.5rem 1rem;
            border-radius: 3rem;
            text-align: center;
            border: 1px solid #2a3e5c;
            color: #b0d0ff;
            min-height: 2.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            box-shadow: inset 0 2px 6px #00000080;
            transition: 0.2s;
        }

        .functions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem 1rem;
            margin-bottom: 1.2rem;
            padding: 0.2rem 0.2rem 0.2rem 0.1rem;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 0.6rem;
        }

        .functions-grid::-webkit-scrollbar { width: 6px; }
        .functions-grid::-webkit-scrollbar-track { background: #0c111b; border-radius: 10px; }
        .functions-grid::-webkit-scrollbar-thumb {
            background: #2e405b;
            border-radius: 10px;
            border: 1px solid #4b6385;
        }

        .function-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1320;
            padding: 0.6rem 0.9rem;
            border-radius: 2rem;
            border: 1px solid #26334a;
            box-shadow: inset 0 1px 2px #00000090, 0 4px 10px #00000040;
            transition: border 0.2s;
            color: #d1e2ff;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .function-item span:first-child {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 0.3px;
        }

        .function-item .icon-dot {
            width: 8px;
            height: 8px;
            background: #1f3f6b;
            border-radius: 50%;
            box-shadow: 0 0 4px #2d73b0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 26px;
            flex-shrink: 0;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1e2636;
            border-radius: 34px;
            transition: .18s ease;
            box-shadow: inset 0 2px 6px #00000080, 0 0 0 1px #2a3c58;
            border: 1px solid #364a6b;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 2px;
            background: linear-gradient(145deg, #b5c9e5, #7f94b0);
            border-radius: 50%;
            transition: .18s ease;
            box-shadow: 0 2px 6px black, 0 0 4px #b0d4ff;
        }

        input:checked + .slider {
            background: #1b4e5e;
            border-color: #2e8ab0;
            box-shadow: inset 0 2px 6px #000000b0, 0 0 8px #2f9fd0;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background: linear-gradient(145deg, #f0f9ff, #b0e0ff);
            box-shadow: 0 0 8px #6ec8ff, 0 2px 4px black;
        }

        .fov-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #0b101a;
            padding: 0.8rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid #26334a;
            margin-bottom: 1rem;
            box-shadow: inset 0 2px 8px #000000b0;
        }

        .fov-container label {
            font-weight: 700;
            color: #b0c6e5;
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            min-width: 40px;
            text-shadow: 0 1px 2px black;
        }

        .fov-container input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #1d4e6b, #5b8ec9);
            border-radius: 10px;
            outline: none;
            box-shadow: inset 0 1px 4px black, 0 0 6px #0b1f33;
        }

        .fov-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle, #b6dcff, #5588c0);
            border-radius: 50%;
            border: 2px solid #aad0ff;
            box-shadow: 0 0 12px #2f9fff, 0 4px 6px black;
            cursor: pointer;
            transition: 0.1s;
        }

        .fov-value {
            font-weight: 800;
            color: #c2dcff;
            background: #0a111e;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 1rem;
            border: 1px solid #3b5577;
            box-shadow: inset 0 1px 2px black;
            min-width: 60px;
            text-align: center;
        }

        .footer {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-top: 0.6rem;
            border-top: 1px solid #1c2537;
            font-weight: 500;
            color: #7b95bd;
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px black;
        }

        .footer .insta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #0d1422;
            padding: 0.3rem 1rem;
            border-radius: 3rem;
            border: 1px solid #2b3f5e;
            color: #9bb9e0;
            font-weight: 600;
        }

        .footer .insta::before {
            content: "📸";
            font-size: 1.1rem;
            filter: drop-shadow(0 0 4px #3f9eff);
        }

        .reset-hint {
            font-size: 0.7rem;
            color: #6a84a8;
            text-align: right;
            margin-top: -0.6rem;
            margin-bottom: 0.3rem;
            letter-spacing: 0.3px;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 500px) {
            body {
                padding: 0;
                align-items: flex-start;
            }
            .panel {
                width: 100%;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                padding: 1rem 0.9rem;
                max-height: none;
                max-width: 100%;
            }
            .panel::before { border-radius: 0; }
            .header h1 { font-size: 1.4rem; }
            .header h1 span { font-size: 0.9rem; }
            .btn-main {
                font-size: 0.95rem;
                padding: 0.85rem 0.4rem;
                min-width: 0;
            }
            .function-item {
                font-size: 0.88rem;
                padding: 0.55rem 0.8rem;
            }
            .functions-grid {
                grid-template-columns: 1fr;
                max-height: none;
            }
            .fov-container {
                padding: 0.7rem 0.9rem;
                gap: 0.6rem;
            }
            .fov-container label { font-size: 0.85rem; }
            .footer { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="panel" id="mainPanel">
        <div class="header">
            <h1>MARIN <span>XITER</span></h1>
            <div style="font-size: 0.8rem; color: #3c5f88; background: #0b111d; padding: 0.2rem 0.8rem; border-radius: 3rem; border: 1px solid #203249;">v2.4.1</div>
        </div>

        <div class="row-buttons">
            <button class="btn-main primary" id="startBtn">▶ Iniciar Free Fire</button>
            <button class="btn-main inject" id="injectBtn">💉 Injetar</button>
        </div>

        <div class="status-inject" id="injectStatus">
            ⚡ Aguardando injeção
        </div>

        <div class="functions-grid" id="functionsGrid">
            <div class="function-item">
                <span><span class="icon-dot"></span> HS Cabeça</span>
                <label class="switch"><input type="checkbox" data-function="HS Cabeça"><span class="slider"></span></label>
            </div>
            <div class="function-item">
                <span><span class="icon-dot"></span> HS Pescoço</span>
                <label class="switch"><input type="checkbox" data-function="HS Pescoço"><span class="slider"></span></label>
            </div>
            <div class="function-item">
                <span><span class="icon-dot"></span> HS Peito</span>
                <label class="switch"><input type="checkbox" data-function="HS Peito"><span class="slider"></span></label>
            </div>
            <div class="function-item">
                <span><span class="icon-dot"></span> Aimkill</span>
                <label class="switch"><input type="checkbox" data-function="Aimkill"><span class="slider"></span></label>
            </div>
            <div class="function-item">
                <span><span class="icon-dot"></span> ESP Linha</span>
                <label class="switch"><input type="checkbox" data-function="ESP Linha"><span class="slider"></span></label>
            </div>
            <div class="function-item">
                <span><span class="icon-dot"></span> ESP Box</span>
                <label class="switch"><input type="checkbox" data-function="ESP Box"><span class="slider"></span></label>
            </div>
            <div class="function-item">
                <span><span class="icon-dot"></span> ESP Esqueleto</span>
                <label class="switch"><input type="checkbox" data-function="ESP Esqueleto"><span class="slider"></span></label>
            </div>
        </div>

        <div class="fov-container">
            <label>FOV</label>
            <input type="range" id="fovSlider" min="60" max="120" value="90" step="1">
            <span class="fov-value" id="fovValue">90</span>
        </div>

        <div class="reset-hint">⏱️ status reseta ao alterar qualquer função ou FOV</div>

        <div class="footer">
            <div class="insta">@MarinX🇧🇷</div>
        </div>
    </div>

    <script>
        (function() {
            const startBtn = document.getElementById('startBtn');
            const injectBtn = document.getElementById('injectBtn');
            const injectStatus = document.getElementById('injectStatus');
            const fovSlider = document.getElementById('fovSlider');
            const fovValue = document.getElementById('fovValue');
            const allCheckboxes = document.querySelectorAll('.switch input[type="checkbox"]');

            let statusResetTimer = null;
            let injectAnimationTimer = null;
            let isInjecting = false;

            function resetStatus(message = '⚡ Status resetado') {
                if (injectAnimationTimer) {
                    clearTimeout(injectAnimationTimer);
                    injectAnimationTimer = null;
                }
                isInjecting = false;
                injectStatus.textContent = message;
                injectStatus.style.color = '#b0d0ff';
                injectStatus.style.borderColor = '#2a3e5c';
                injectBtn.disabled = false;
            }

            function scheduleStatusReset() {
                if (statusResetTimer) clearTimeout(statusResetTimer);
                statusResetTimer = setTimeout(() => {
                    if (!isInjecting) {
                        resetStatus('⚡ Status resetado');
                    } else {
                        if (injectAnimationTimer) {
                            clearTimeout(injectAnimationTimer);
                            injectAnimationTimer = null;
                        }
                        isInjecting = false;
                        injectBtn.disabled = false;
                        resetStatus('⚡ Status resetado');
                    }
                }, 180);
            }

            allCheckboxes.forEach(cb => {
                cb.addEventListener('change', scheduleStatusReset);
            });

            fovSlider.addEventListener('input', function() {
                fovValue.textContent = this.value;
                scheduleStatusReset();
            });

            startBtn.addEventListener('click', function() {
                scheduleStatusReset();
                injectStatus.textContent = '🟢 Free Fire iniciado (simulação)';
                injectStatus.style.color = '#b0ffc0';
                injectStatus.style.borderColor = '#2e8a5e';
                if (statusResetTimer) clearTimeout(statusResetTimer);
                statusResetTimer = setTimeout(() => {
                    if (!isInjecting) resetStatus('⚡ Status resetado');
                }, 2000);
            });

            injectBtn.addEventListener('click', function() {
                if (isInjecting) return;
                if (statusResetTimer) { clearTimeout(statusResetTimer); statusResetTimer = null; }
                if (injectAnimationTimer) { clearTimeout(injectAnimationTimer); injectAnimationTimer = null; }

                isInjecting = true;
                injectBtn.disabled = true;

                injectStatus.textContent = '⏳ Injetando códigos...';
                injectStatus.style.color = '#ffd966';
                injectStatus.style.borderColor = '#a07d3a';

                injectAnimationTimer = setTimeout(() => {
                    injectStatus.textContent = '✅ Códigos injetados com sucesso!';
                    injectStatus.style.color = '#9bffb0';
                    injectStatus.style.borderColor = '#3faa6b';
                    isInjecting = false;
                    injectBtn.disabled = false;
                    injectAnimationTimer = null;

                    if (statusResetTimer) clearTimeout(statusResetTimer);
                    statusResetTimer = setTimeout(() => {
                        if (!isInjecting) resetStatus('⚡ Status resetado');
                    }, 2500);
                }, 1800);
            });

            resetStatus('⚡ Aguardando injeção');
        })();
    </script>
</body>
  </html>
